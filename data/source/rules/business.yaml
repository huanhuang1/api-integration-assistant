rule_id: business_account_rules
description: Business account-opening fields and synthetic examples. All values are fictional.
operations:
  createCustomer:
    explanation: Create the business customer using its legal name and company registration number. Keep the returned customerId for later steps.
    fixed: {customerType: BUSINESS}
    example_inputs: {legalName: Example Company Ltd, companyRegistrationNumber: DEMO-REG-001}
    context_inputs: {}
    optional_fields: [marketingOptIn]
    not_applicable_fields: [fullName]
    example_response: {customerId: cus_demo_002}
  verifyIdentity:
    explanation: Verify company registration using COMPANY_REGISTRATION as the verification type and the customerId from createCustomer. Check the returned status before proceeding.
    fixed: {verificationType: COMPANY_REGISTRATION}
    example_inputs: {}
    context_inputs: {}
    optional_fields: []
    not_applicable_fields: []
    example_response: {verificationId: ver_demo_002, status: PASSED}
  createAccount:
    explanation: Create the account in the requested currency using customerId and verificationId from the earlier responses, only after verification returns PASSED.
    fixed: {}
    example_inputs: {}
    context_inputs: {currency: currency}
    optional_fields: []
    not_applicable_fields: []
    example_response: {accountId: acc_demo_002}
